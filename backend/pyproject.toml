[project]
name = "jecrc-scm-backend"
version = "0.1.0"
description = "JECRC SCM API Backend"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "aiomysql",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "aiofiles",
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
